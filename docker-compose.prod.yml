# Self-hosted production: the app (web + API + sockets) behind Caddy, which serves HTTPS.
# Needs `.env.prod` (copy `.env.prod.example`). Steps: DEPLOY.md, « Self-hosting (Docker Compose + Caddy) ».
#
#   docker compose -f docker-compose.prod.yml run --rm migrate   # apply the DB migrations
#   docker compose -f docker-compose.prod.yml up -d --build      # start / update
#   docker compose -f docker-compose.prod.yml logs -f app
name: lebonquizz-prod
services:
  app:
    build: .
    image: lebonquizz:prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      PORT: '8080'
      TRUST_PROXY: 'true' # behind Caddy: real client IP for the rate limits, https for the cookie
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./prod-data/uploads:/data/uploads # uploaded pictures and sounds
    expose:
      - '8080' # only Caddy reaches it
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file: .env.prod # SITE_ADDRESS, TLS_MODE
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates (keep this volume, or Let's Encrypt rate limits bite)
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  # One-shot: `docker compose -f docker-compose.prod.yml run --rm migrate`. Migrations need the
  # direct connection (Neon's pooled URL goes through PgBouncer).
  migrate:
    image: lebonquizz:prod
    build: .
    env_file: .env.prod
    profiles: [tools]
    command:
      - sh
      - -c
      - 'DATABASE_URL="$${DATABASE_URL_UNPOOLED:-$$DATABASE_URL}" ./node_modules/.bin/prisma migrate deploy'

volumes:
  caddy_data:
  caddy_config:
