# Local Postgres + Mailpit for development: `docker compose up -d`
name: lebonquizz
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lbq
      POSTGRES_PASSWORD: lbq
      POSTGRES_DB: lbq
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lbq -d lbq']
      interval: 5s
      timeout: 3s
      retries: 10
  # Catches every e-mail sent in dev (password reset): SMTP localhost:1025, inbox at
  # http://localhost:8025. Nothing real is ever sent.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
