# Local Postgres for development: `docker compose up -d`
name: lebonquizz
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lbq
      POSTGRES_PASSWORD: lbq
      POSTGRES_DB: lbq
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lbq -d lbq']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
